name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/bru/manifest.json)
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag=$tag manifest=$manifest pyproject=$project"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$project" ]; then
            echo "::error::Tag v$tag does not match manifest ($manifest) and pyproject ($project)"
            exit 1
          fi

      - name: Zip the integration
        run: |
          cd custom_components/bru
          zip -r "$GITHUB_WORKSPACE/bru.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" bru.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
