name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Protocol and pairing tests
        run: |
          pip install bleak pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests --ignore=tests/ha
      - name: Home Assistant tests
        run: |
          pip install pytest-homeassistant-custom-component aiousbwatcher pyserial habluetooth bluetooth-adapters bluetooth-auto-recovery bluetooth-data-tools bleak-retry-connector dbus-fast
          python -m pytest -o asyncio_mode=auto tests/ha
