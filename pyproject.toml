[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bru-ble"
version = "0.1.7"
description = "Bluetooth client and Home Assistant integration for the BRU Maker One"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["custom_components/bru"]
include = ["bru_ble*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/bru", "."]
