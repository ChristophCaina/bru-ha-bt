[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bru-ble"
version = "0.1.9"
description = "Bluetooth client and Home Assistant integration for the BRU Maker One"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["custom_components/bru"]
include = ["bru_ble*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/bru", "."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter wraps code; long strings and test literals may stay long.
ignore = ["E501", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "bru_ble"]
force-sort-within-sections = true
combine-as-imports = true
